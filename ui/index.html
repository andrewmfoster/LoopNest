<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>LoopNest</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
  // Collect errors from the very start (window.__ln.check() reports them).
  window.__lnErr = []; window.__lnWarn = [];
  addEventListener('error', e => {
    const tg = e.target;
    if (tg && tg !== window && (tg.src || tg.href)) __lnErr.push('resource: ' + (tg.src || tg.href));
    else __lnErr.push('error: ' + (e.message || e.type) + (e.filename ? ' @' + e.filename + ':' + e.lineno : ''));
  }, true);
  addEventListener('unhandledrejection', e => __lnErr.push('rejection: ' + ((e.reason && e.reason.message) || e.reason)));
  (() => {
    const ce = console.error.bind(console), cw = console.warn.bind(console);
    console.error = (...a) => { __lnErr.push('console.error: ' + a.join(' ')); ce(...a); };
    console.warn = (...a) => { __lnWarn.push(a.join(' ')); cw(...a); };
  })();
</script>
<style>
  /* Bundled plugin font: BinaryData, served by the editor's resource provider by filename. No network. */
  @font-face { font-family: "JBM Local"; src: url("fonts/JetBrainsMono-Regular.ttf") format("truetype"); font-weight: 400; }
  @font-face { font-family: "JBM Local"; src: url("fonts/JetBrainsMono-Bold.ttf") format("truetype"); font-weight: 700; }

  :root {
    --bg: #060809;  --deep: #030506; --strip: #0d1213;
    --line: #eef3f5; --soft: #97a3a6; --faint: #343f41;
    --teal: #1fe3da; --teal-dim: #1f9089; --dormant: #5d676a;
    --acc: var(--teal);
    --frame: rgba(151,163,166,0.45);
    --font: "JBM Local", "JetBrains Mono", ui-monospace, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--deep); overflow: hidden; }
  body { font-family: var(--font); color: var(--line); -webkit-font-smoothing: antialiased; user-select: none; }
  button { font-family: var(--font); color: inherit; }

  #stage {
    position: absolute; left: 0; top: 0; width: 1672px; height: 941px;
    transform-origin: 0 0;   /* scaled from the corner, like the native HATCH overlay's rect */
    background: var(--bg);
  }
  #stage.bypass { --acc: var(--dormant); }
  #stage.bypass .glowlab { color: var(--soft) !important; text-shadow: none !important; }
  .glowlab { transition: color .12s; }
  .abs { position: absolute; }
  #frame { left: 10px; top: 10px; width: 1652px; height: 921px; border: 2px solid rgba(238,243,245,0.85);
           border-radius: 15px; pointer-events: none; }

  .lab  { font-weight: 700; font-size: 13px; letter-spacing: 0.16em; color: var(--soft); text-transform: uppercase; }
  .cap  { font-size: 12px; letter-spacing: 0.04em; color: var(--soft); line-height: 1.45; }
  .val  { font-size: 14px; letter-spacing: 0.04em; color: var(--line); font-variant-numeric: tabular-nums; }
  .src  { color: var(--soft); }
  .hot  { color: var(--teal); }
  .drag { cursor: ns-resize; border-bottom: 1px dashed var(--faint); }
  .drag:hover { border-bottom-color: var(--teal); }
  .ro { border-bottom: 1px solid transparent; }   /* the host's tempo: display-only, same box as the mock's draggable value */

  .strip {
    background: var(--strip); border: 1.3px solid var(--faint); border-radius: 12px;
  }
  .group { border: 1.5px solid var(--frame); border-radius: 18px; }
  .key {
    background: transparent; border: 1.6px solid rgba(238,243,245,0.8); border-radius: 9px;
    cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 12px;
    font: 700 16px var(--font); letter-spacing: 0.14em; color: var(--line);
  }
  .key:hover { border-color: rgba(238,243,245,0.95); }
  .key:active { background: rgba(238,243,245,0.06); }
  .key.on { border: 2.4px solid var(--teal); }
  .key:focus-visible, .tab:focus-visible, .ibtn:focus-visible { outline: 1px solid var(--teal); outline-offset: 3px; }
  .ibtn {
    background: transparent; border: 1.3px solid var(--faint); border-radius: 8px; cursor: pointer;
    color: var(--line); font: 700 14px var(--font); display: flex; align-items: center; justify-content: center;
  }
  .ibtn:hover { border-color: var(--soft); color: var(--teal); }

  /* ---------- header ---------- */
  /* r2: header holds only the logo and the mode tabs, 42 px tall (was 72) */
  #logo { left: 24px; top: 22px; width: 290px; height: 42px; display: flex; align-items: center; gap: 14px; padding-left: 8px; }
  #wordmark {
    font: 700 26px var(--font); letter-spacing: 0.12em;
    background: linear-gradient(180deg, #f5f7f8 0%, #d2d7da 18%, #7d848a 50%, #b9bfc3 82%, #e7eaec 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(2px 3px 0 rgba(0,0,0,0.5));
  }
  /* stage 2 (r3 layout): BANK is a 200 px dropdown where the NEST label was. The name keeps r2's 13 px bold but its
     tracking drops from 0.1em to 0.02em (and the left pad from 12 to 10) so a 20-character bank name fits unclipped. */
  #bank { position: absolute; left: 14px; top: 12px; width: 200px; height: 34px; cursor: pointer; text-align: left; border-radius: 9px;
          display: flex; align-items: center; justify-content: space-between; padding: 0 10px 0 10px; gap: 6px; color: var(--line); }
  #bank:hover { border-color: var(--soft); }
  #bank:focus-visible { outline: 1px solid var(--teal); outline-offset: 3px; }
  #bank .name { font: 700 13px var(--font); letter-spacing: 0.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .chev { color: var(--soft); flex: none; display: flex; }
  .caret { width: 10px; height: 6px; display: block; }
  #bank:hover .chev, #bin:hover .chev { color: var(--line); }
  /* stage 2 r2: SPIN has no key box. The reel dial is the control (v1 SpinDial: a big rotor, click = spin burst),
     100 px, with r2's SPIN word beside it, centred under the cassette in the space the BAR / BEAT line left.
     Clickability comes from hover (teal halo, arrows and word go teal) and press (dial dips, arrows full teal). */
  #spin { position: absolute; left: 368px; top: 328px; width: 190px; height: 104px; border: 0; background: transparent; border-radius: 12px;
          gap: 14px; padding: 0; justify-content: center; }
  #spin:hover, #spin:active { border: 0; background: transparent; }
  #spin .lbl { font-size: 15px; letter-spacing: 0.22em; padding-left: 0.22em; color: var(--line); transition: color .15s, text-shadow .15s; }
  #spin:hover .lbl { color: var(--teal); text-shadow: 0 0 10px rgba(31,227,218,0.35); }
  #dial { width: 100px; height: 100px; display: block; flex: none; transition: transform .08s; }
  #spin:active #dial { transform: translateY(1px) scale(0.95); }
  #spin:active .lbl { transform: translateY(1px); }
  /* Spin history ◀ ▶ (Andrew, 10-11): bare glyph keys either side of the SPIN dial, level with its hub, in the SPIN
     word's colour and hover glow. Dim at the ends of the history. */
  .hist { position: absolute; top: 365px; width: 30px; height: 30px; padding: 0; border: 0; background: transparent; cursor: pointer;
          display: flex; align-items: center; justify-content: center; font: 700 13px var(--font); color: var(--line);
          transition: color .15s, text-shadow .15s, opacity .15s; }
  #h-back { left: 341px; }
  #h-fwd { left: 562px; }
  .hist:hover:not(:disabled) { color: var(--teal); text-shadow: 0 0 10px rgba(31,227,218,0.35); }
  .hist:active:not(:disabled) { transform: translateY(1px); }
  .hist:disabled { opacity: 0.28; cursor: default; }
  .hist:focus-visible { outline: 1px solid var(--teal); outline-offset: 3px; }
  /* stage 2 r3: AUDITION | LIVE is one two-way switch. One outer border, a hairline split, icon + word in each half.
     The lit half glows on its whole frame: teal edge, r2's teal glow, r2's 10% teal fill, bright icon and word.
     The unlit half is dark with a dim icon and word, and brightens on hover. No underline. */
  #tabs { left: 1288px; top: 22px; width: 360px; height: 42px; display: grid; grid-template-columns: 1fr 1fr;
          border: 1.5px solid var(--faint); border-radius: 12px; }
  .tab { position: relative; background: transparent; border: 0; cursor: pointer; color: var(--soft); display: flex; flex-direction: row;
         align-items: center; justify-content: center; gap: 10px; padding: 0; transition: background-color .15s; }
  .tab:first-child { border-radius: 10.5px 0 0 10.5px; }
  .tab:last-child { border-radius: 0 10.5px 10.5px 0; }
  .tab + .tab { border-left: 1px solid var(--faint); }
  .tab .t { font: 700 17px var(--font); letter-spacing: 0.16em; padding-left: 0.16em; }
  .tab .t, .tab .ico { opacity: 0.55; transition: opacity .15s, color .15s; }
  .tab .ico { width: 26px; height: 22.5px; flex: none; display: block; }
  .tab:not(.on):hover { background: rgba(151,163,166,0.07); color: var(--line); }
  .tab:not(.on):hover .t, .tab:not(.on):hover .ico { opacity: 0.9; }
  .tab.on { color: var(--line); background: rgba(31,227,218,0.10); cursor: default; }
  .tab.on .t, .tab.on .ico { opacity: 1; }
  .tab.on .t { text-shadow: 0 0 10px rgba(31,227,218,0.45); }
  .tab.on .ico { filter: drop-shadow(0 0 4px rgba(31,227,218,0.55)); }
  .tab.on::after { content: ""; position: absolute; inset: -1.5px; border: 1.6px solid var(--teal); border-radius: inherit; pointer-events: none;
                   box-shadow: 0 0 14px rgba(31,227,218,0.30), inset 0 0 12px rgba(31,227,218,0.16); }
  .tab.on:first-child::after { border-radius: 12px 0 0 12px; }
  .tab.on:last-child::after { border-radius: 0 12px 12px 0; }
  .dimmable { transition: opacity .25s; }
  #stage.fx .dimmable { opacity: 0.28; pointer-events: none; }

  /* ---------- hero ---------- */
  /* NEST: rack of spines + loaded cassette, one group */
  /* r2: header 36 px shorter, the nest/scope row starts at 76 (was 112) and is 36 px taller */
  #nest { left: 24px; top: 76px; width: 640px; height: 444px; }
  /* the BAR / BEAT / BPM line is cut, so the cassette canvas only covers the deck (cassette drawn at nest 306,104, 314 x 211) */
  #cas { position: absolute; left: 300px; top: 92px; width: 326px; height: 234px; }
  #n-search { position: absolute; left: 222px; top: 12px; width: 276px; height: 34px; display: flex; align-items: center;
              gap: 8px; padding: 0 10px 0 10px; border-radius: 9px; cursor: text; }
  #n-search:focus-within { border-color: var(--teal); }
  #n-search svg { width: 14px; height: 14px; flex: none; }
  #n-q { flex: 1; min-width: 0; background: transparent; border: 0; outline: none; color: var(--line);
         font: 400 12px var(--font); letter-spacing: 0.06em; padding: 0; }
  #n-q::placeholder { color: var(--soft); opacity: 0.8; font-weight: 700; letter-spacing: 0.16em; font-size: 11px; }
  #n-count { font-size: 12px; color: var(--soft); white-space: nowrap; letter-spacing: 0.02em; font-variant-numeric: tabular-nums; }
  #n-count.hot { color: var(--teal); }
  /* stage 2 (r3 layout): one tight 120 px stepper box, ◀ n / N ▶, arrows right against the number.
     Box = r2's strip; arrows = r2's .ibtn with the border dropped; number = r2's n-pos stepped down 16 -> 13 px to fit. */
  #n-step { position: absolute; left: 506px; top: 12px; width: 120px; height: 34px; display: flex; align-items: center;
            justify-content: center; gap: 1px; padding: 0 3px; border-radius: 9px; }
  #n-step .ibtn { width: 22px; height: 26px; font-size: 11px; border-color: transparent; border-radius: 6px; flex: none; padding: 0; color: var(--soft); }
  #n-step .ibtn:hover { border-color: var(--faint); color: var(--teal); }
  #n-pos { text-align: center; font: 700 13px var(--font); letter-spacing: 0.02em; font-variant-numeric: tabular-nums; white-space: nowrap; padding: 0 2px;
           cursor: text; border-radius: 4px; }
  #n-pos:hover { color: var(--teal); }
  #n-pos input { width: 64px; height: 24px; background: var(--deep); border: 1.3px solid var(--teal); border-radius: 5px; outline: none; padding: 0 4px;
                 color: var(--line); font: 700 13px var(--font); letter-spacing: 0.02em; text-align: center; font-variant-numeric: tabular-nums; }
  #n-x { flex: none; width: 16px; height: 16px; padding: 0; border: 0; background: transparent; color: var(--soft); cursor: pointer; display: none;
         font: 700 13px var(--font); line-height: 16px; }
  #n-x:hover { color: var(--teal); }
  #n-search.q #n-x { display: block; }
  #n-rack { position: absolute; left: 14px; top: 58px; width: 282px; height: 372px; overflow-y: auto; overflow-x: hidden; padding: 5px 0 9px;
            scrollbar-width: none;
            -webkit-mask-image: linear-gradient(180deg, transparent 0, #000 10px, #000 calc(100% - 14px), transparent 100%);
                    mask-image: linear-gradient(180deg, transparent 0, #000 10px, #000 calc(100% - 14px), transparent 100%); }
  #n-rack::-webkit-scrollbar { display: none; }
  /* drag-in (Andrew, 10-17): the rack lights while files dragged over it may drop (ln_drop from the native
     RackDropTarget), in .spine.sel's teal. Not drawn at rest; above the dimmed rack so it lights in LIVE too. */
  #n-drop { position: absolute; left: 14px; top: 58px; width: 282px; height: 372px; border: 1.6px solid var(--teal); border-radius: 9px;
            background: rgba(31,227,218,0.10); box-shadow: 0 0 12px rgba(31,227,218,0.16); pointer-events: none; display: none; }
  #n-drop.on { display: block; }
  #n-rail { position: absolute; left: 6px; top: 64px; width: 2px; height: 360px; border-radius: 1px; background: rgba(52,63,65,0.6); pointer-events: none; }
  #n-thumb { position: absolute; left: 0; width: 2px; border-radius: 1px; background: var(--soft); opacity: 0.7; }
  .spine { position: relative; display: block; width: 256px; height: 32px; margin: 0 0 5px 0; padding: 0;
           background: var(--strip); border: 1.3px solid var(--faint); border-radius: 5px; cursor: pointer; text-align: left;
           transition: transform .2s cubic-bezier(.3,1.5,.55,1), border-color .15s, background-color .15s; }
  .spine::before, .spine::after { content: ""; position: absolute; top: 4px; bottom: 4px; width: 7px;
           background: repeating-linear-gradient(90deg, rgba(151,163,166,0.55) 0 1px, transparent 1px 3px); opacity: 0.8; }
  .spine::before { left: 4px; } .spine::after { right: 4px; }
  .spine .lbl { position: absolute; left: 14px; right: 14px; top: 4px; bottom: 4px; border-left: 1px solid rgba(52,63,65,0.9);
           border-right: 1px solid rgba(52,63,65,0.9); display: flex; align-items: center; justify-content: space-between; padding: 0 7px 0 8px; gap: 6px; }
  .spine .nm { font-size: 12px; letter-spacing: 0; color: var(--soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .spine .bp { font-size: 12px; color: var(--soft); font-variant-numeric: tabular-nums; }
  .spine:not(.sel) { transition: transform .2s cubic-bezier(.2,.7,.3,1), border-color .15s, background-color .15s; }   /* stage 2: home without overshoot, so it never clips at the rack edge */
  .spine:hover { border-color: var(--soft); transform: translateX(4px); }
  .spine:hover .nm { color: var(--line); }
  .spine:focus-visible { outline: 1px solid var(--teal); outline-offset: 2px; }
  .spine.sel { border: 1.6px solid var(--teal); background: rgba(31,227,218,0.10); transform: translateX(14px);
               box-shadow: 0 0 12px rgba(31,227,218,0.16); }
  .spine.sel::before, .spine.sel::after { background: repeating-linear-gradient(90deg, rgba(31,227,218,0.7) 0 1px, transparent 1px 3px); }
  .spine.sel .nm, .spine.sel .bp { color: var(--line); }
  .spine.hide { display: none; }
  #stage.fx .spine.sel { transform: none; box-shadow: none; }
  #n-wire { position: absolute; left: 0; top: 0; width: 640px; height: 444px; pointer-events: none; overflow: visible; transition: opacity .25s; }
  #stage.fx #n-wire { opacity: 0; }
  #scope { left: 680px; top: 76px; width: 968px; height: 366px; }
  /* r2: LOOP is a small toggle in the scope's bottom strip, beside the end time */
  #loop-t { left: 1492px; top: 409px; height: 22px; padding: 0 9px 0 7px; display: flex; align-items: center; gap: 6px;
            background: transparent; border: 1.2px solid var(--faint); border-radius: 11px; cursor: pointer;
            font: 700 11px var(--font); letter-spacing: 0.16em; color: var(--soft); }   /* final: 10 -> 11 px */
  #loop-t svg { width: 12px; height: 12px; flex: none; }
  #loop-t svg path { stroke: currentColor; } #loop-t svg path.hd { fill: currentColor; stroke: none; }
  #loop-t .led { width: 5px; height: 5px; border-radius: 50%; border: 1px solid currentColor; flex: none; }
  #loop-t:hover { border-color: var(--soft); color: var(--line); }
  #loop-t.on { border-color: var(--teal); color: var(--line); background: rgba(31,227,218,0.12); }
  #loop-t.on svg { color: var(--teal); }
  #loop-t.on .led { background: var(--teal); border-color: var(--teal); box-shadow: 0 0 5px rgba(31,227,218,0.7); }
  #loop-t:focus-visible { outline: 1px solid var(--teal); outline-offset: 2px; }
  /* SNAP: the trim handles land on the drum hits (on / off), beside LOOP. BPM: the footer's tempo readout is a button. */
  #snap-t { right: 188px; top: 409px; height: 22px; padding: 0 9px; display: flex; align-items: center; gap: 6px;
            background: transparent; border: 1.2px solid var(--faint); border-radius: 11px; cursor: pointer;
            font: 700 11px var(--font); letter-spacing: 0.16em; color: var(--soft); white-space: nowrap; }
  #snap-t:hover { border-color: var(--soft); color: var(--line); }
  #snap-t.on { border-color: var(--teal); color: var(--line); background: rgba(31,227,218,0.12); }
  #snap-t:focus-visible { outline: 1px solid var(--teal); outline-offset: 2px; }
  #bpm-t { top: 407px; height: 26px; padding: 0; background: transparent; border: 1.2px solid var(--faint); border-radius: 13px; cursor: pointer; }
  #bpm-t:hover, #bpm-t:focus-visible { border-color: var(--teal); background: rgba(31,227,218,0.10); outline: none; }
  #bpm-in { top: 407px; height: 26px; display: none; z-index: 5; background: var(--deep); border: 1.3px solid var(--teal); border-radius: 13px; outline: none;
            padding: 0 8px; color: var(--line); font: 700 12px var(--font); letter-spacing: 0.04em; text-align: center; font-variant-numeric: tabular-nums; }
  /* the tempo cell's value drags up and down (a tempo of LoopNest's own; SYNC goes off) */
  #tempo-line { cursor: ns-resize; touch-action: none; user-select: none; -webkit-user-select: none; }
  #tempo-line:hover .sl, #tempo-line.drag .sl { color: var(--teal); }
  .layer { transition: opacity .25s; }
  .layer.fxonly { opacity: 0; pointer-events: none; }
  #stage.fx .layer.audonly { opacity: 0; pointer-events: none; }
  #stage.fx .layer.fxonly { opacity: 1; pointer-events: auto; }

  /* stage 2 row under the scope (r3 layout). Two groups, no plate: they read by spacing alone
     (12 px inside a group, 36 px between). Play the tape 680-1170: PLAY 212 · TEMPO 266.
     Print it 1206-1648: FX 72 · BIN 150 · HATCH 196. Cells keep r2's 66 px height. */
  #pl-play { left: 680px; top: 454px; width: 212px; height: 66px; flex-direction: column; gap: 5px; font-size: 12px; }
  #pl-play svg { width: 20px; height: 20px; }
  /* TEMPO cell: r2's TEMPO cell (label + SYNC over the BPM) and r2's PITCH layout (knob, label over value) share one strip */
  #tempo { left: 904px; top: 454px; width: 266px; height: 66px; padding: 0 12px; display: flex; align-items: center; gap: 11px; }
  #tempo .tcol { display: flex; flex-direction: column; justify-content: space-between; align-self: stretch; padding: 9px 0; gap: 0; }
  #tempo .row { display: flex; align-items: center; gap: 10px; }
  #tempo .div { width: 1px; align-self: stretch; margin: 11px 0; background: var(--faint); flex: none; }
  #tempo .pcol { display: flex; align-items: center; gap: 9px; }
  #tempo .pcol .knob { position: relative; }
  #tempo .io { display: flex; flex-direction: column; gap: 4px; }
  #sync { background: transparent; border: 1.3px solid var(--faint); border-radius: 6px; padding: 2px 8px; cursor: pointer;
          font: 700 11px var(--font); letter-spacing: 0.14em; color: var(--soft); }
  #sync:hover { border-color: var(--soft); }
  #sync.on { border-color: var(--teal); color: var(--line); }
  #tempo .val { font-size: 16px; letter-spacing: 0.02em; white-space: nowrap; display: flex; align-items: baseline; gap: 10px; --ls: 0.02em; }
  #tempo .io .val { display: block; }
  #meters { left: 680px; top: 454px; width: 968px; height: 66px; }

  /* stage 2 r3: FX is one toggle cell, icon + word + r2's LOOP-style LED. Icon = a sparkle ("effects"), since the
     r2 knob face read like any other knob on the panel. Off: faint edge, soft icon and word, hollow dot.
     On: teal edge, 12% teal fill, teal icon, bright word, lit dot. Cell 80 px (r3's width); print-group gaps 8 px. */
  #fx { left: 1206px; top: 454px; width: 80px; height: 66px; border-radius: 10px; border: 1.3px solid var(--faint); background: var(--strip);
        display: flex; align-items: center; justify-content: center; gap: 7px; cursor: pointer; padding: 0;
        font: 700 13px var(--font); letter-spacing: 0.16em; color: var(--soft); }
  #fx .fxl { padding-left: 0.16em; }
  #fx .fxi { width: 20px; height: 20px; flex: none; opacity: 0.85; }
  #fx .led { width: 6px; height: 6px; border-radius: 50%; border: 1.1px solid var(--soft); flex: none; }
  #fx:hover { border-color: var(--soft); color: var(--line); }
  #fx.on { border-color: var(--teal); background: rgba(31,227,218,0.12); color: var(--line); }
  #fx.on .fxi { color: var(--teal); opacity: 1; }
  #fx.on .led { background: var(--teal); border-color: var(--teal); box-shadow: 0 0 5px rgba(31,227,218,0.7); }
  #fx:focus-visible { outline: 1px solid var(--teal); outline-offset: 3px; }
  /* BIN on one line: label, bin name, chevron (r2 had it on two lines) */
  /* final: BIN is r2's two-line cell again (label + chevron on top, bin name below), at 150 px */
  #bin { left: 1294px; top: 454px; width: 150px; height: 66px; padding: 9px 12px; border-radius: 10px; flex-direction: column;
         align-items: stretch; justify-content: space-between; gap: 0; }
  #bin .row { display: flex; align-items: center; justify-content: space-between; }
  #hatch { left: 1452px; top: 454px; width: 196px; height: 66px; padding: 0; border-radius: 10px;
           border: 1.3px solid var(--faint); background: transparent;
           transition: transform .14s, box-shadow .14s, background-color .3s, border-color .3s; }
  #hatch .rest { position: absolute; left: 0; right: 0; bottom: 6px; text-align: center; font-size: 11px; letter-spacing: 0.3em;
                 padding-left: 0.3em; color: var(--soft); opacity: 0.75; transition: opacity .25s, color .15s; }
  #hatch.idle.hov .rest { color: var(--line); opacity: 1; }
  #hatch.idle.hov { border-color: var(--soft); }
  #hatch-cv { position: absolute; left: 0; top: 0; width: 194px; height: 64px; pointer-events: none; transition: opacity .3s; }
  #hatch .grip { position: absolute; left: 6px; top: 12px; width: 12px; height: 24px; opacity: 0; transition: opacity .3s;
                 background: radial-gradient(circle, var(--soft) 1.5px, transparent 1.9px) 0 0 / 6px 8px; }
  #hatch .file { position: absolute; left: 8px; right: 8px; bottom: 5px; text-align: center; font-weight: 400; font-size: 10px;
                 letter-spacing: 0; color: var(--soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; opacity: 0; transition: opacity .3s; }
  #hatch .restale { position: absolute; left: 0; right: 0; bottom: 5px; display: flex; align-items: center; justify-content: center; gap: 6px;
                    opacity: 0; transition: opacity .25s; font-size: 11px; font-weight: 700; letter-spacing: 0.14em; color: var(--line); }
  #hatch .restale svg { width: 15px; height: 15px; }
  #hatch::after { content: ""; position: absolute; inset: -2px; border-radius: 11px; border: 2px solid var(--teal); opacity: 0; pointer-events: none; }
  #hatch.busy .rest, #hatch.tile .rest, #hatch.stale .rest { opacity: 0; }
  #hatch.busy { border: 1.6px solid rgba(31,227,218,0.5); cursor: progress; }
  #hatch.tile { background: var(--teal); border-color: var(--teal); cursor: grab; }
  #hatch.tile .file { color: var(--bg); font-weight: 700; }
  #hatch.tile .grip { background: radial-gradient(circle, var(--bg) 1.5px, transparent 1.9px) 0 0 / 6px 8px; }
  #hatch.tile::after { animation: tilepulse 1.8s ease-in-out infinite; }
  @keyframes tilepulse { 0%, 100% { opacity: 0.45; box-shadow: 0 0 0 0 rgba(31,227,218,0); } 50% { opacity: 1; box-shadow: 0 0 16px 1px rgba(31,227,218,0.30); } }
  #hatch.tile.hov { transform: translate(-2px, -3px); box-shadow: 4px 7px 0 rgba(0,0,0,0.6); }
  #hatch.tile.prs { cursor: grabbing; transform: translate(-3px, -5px); box-shadow: 6px 11px 4px rgba(0,0,0,0.65); }
  #hatch.tile .grip, #hatch.tile .file { opacity: 1; }
  #hatch.stale { background: transparent; border: 1.6px dashed rgba(151,163,166,0.7); }
  #hatch.stale #hatch-cv { opacity: 0.28; }
  #hatch.stale .grip { opacity: 0.45; }
  #hatch.stale .restale { opacity: 1; }
  /* under HATCH, in the gap above the rack: the loop facts' faint voice (" guessed") */
  #odd-note { right: 24px; top: 521px; font: 400 12px var(--font); letter-spacing: 0.6px; line-height: 14px;
              color: rgba(151,163,166,0.55); white-space: nowrap; pointer-events: none; }
  #bin { border: 1.3px solid var(--faint); background: var(--strip); font-size: 14px; font-weight: 400; letter-spacing: 0.04em; }
  #bin:hover { border-color: var(--soft); }
  #bin .path { min-width: 0; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* r2 anchoring: every readout value sits in a fixed-width slot (--n chars incl. letter-spacing), so labels never move */
  .sl { display: inline-block; white-space: pre; text-align: right; font-variant-numeric: tabular-nums;
        width: calc(var(--n) * (1ch + var(--ls, 0.04em))); overflow: visible; }
  .sl.l { text-align: left; }


  /* ---------- rack ---------- */
  #rack { left: 24px; top: 536px; width: 1624px; height: 290px; }
  /* r2: CHARACTER label removed; the six columns re-centre in the panel (top 25, was 34 under the label) */
  /* stage 2: column box 247 tall (r2 240) so the name row at 222 sits inside it; divider kept at r2's 8..232 */
  .col { position: absolute; top: 25px; width: 251px; height: 247px; }
  .col + .col::before { content: ""; position: absolute; left: -8px; top: 8px; bottom: 15px; border-left: 1px solid rgba(151,163,166,0.35); }
  .knob { position: absolute; cursor: ns-resize; touch-action: none; }
  .knob svg { display: block; overflow: visible; }
  .k-arc { stroke: var(--acc); fill: none; stroke-linecap: round; }
  .k-glow { stroke: var(--acc); fill: none; stroke-linecap: round; opacity: 0.2; }
  .knob:hover .k-ring { stroke: var(--teal); }
  .secl { position: absolute; left: 0; right: 0; top: 4px; text-align: center; }
  .namel { position: absolute; left: 0; right: 0; top: 222px; text-align: center; display: flex; justify-content: center; gap: 12px; align-items: baseline; }
  .namel .nm { font: 700 19px var(--font); letter-spacing: 0.14em; color: var(--soft); }
  .namel .val { font-size: 13px; }
  .band { position: absolute; cursor: ew-resize; touch-action: none; }
  .band-fill { fill: var(--acc); }
  .band-line { stroke: var(--acc); fill: none; }
  .bandv { position: absolute; left: 0; right: 0; text-align: center; font-size: 12px; color: var(--soft); letter-spacing: 0.03em; --ls: 0.03em; }
  .bandv b { color: var(--line); font-weight: 400; }
  .ter { position: absolute; display: flex; align-items: center; gap: 12px; }
  .ter .knob { position: relative; }
  /* panel power (mock panel-power-2026-10-03, variant A): a light leads each name row; only the light toggles the panel (10-08: the name and its value no longer do) */
  .pwr { position: absolute; width: 26px; height: 26px; padding: 0; margin: 0; border: 0; background: transparent; cursor: pointer;
         display: flex; align-items: center; justify-content: center; }
  .pwr i { width: 11px; height: 11px; border-radius: 50%; border: 1.5px solid var(--soft); transition: background .1s, box-shadow .1s, border-color .1s; }
  .pwr:hover i { border-color: var(--line); }
  .pwr.on i { background: var(--teal); border-color: var(--teal); box-shadow: 0 0 6px rgba(31,227,218,0.85), 0 0 14px rgba(31,227,218,0.35); }
  #stage.bypass .pwr.on i { background: var(--dormant); border-color: var(--dormant); box-shadow: none; }
  .namel .pwr { position: static; margin-right: -6px; align-self: center; }
  /* a value readout you can click to type in (typeIn) */
  .tv { cursor: text; }
  .tv:hover { color: var(--teal); }
  .tv input { width: max(100%, 6ch); height: 1.5em; box-sizing: border-box; background: var(--deep); border: 1.3px solid var(--teal); border-radius: 5px;
              outline: none; padding: 0 3px; color: var(--line); font: inherit; letter-spacing: inherit; text-align: center; font-variant-numeric: tabular-nums; }
  /* REVERB TYPE (10-17): PLATE / HALL / SPRING, a three-way stack right of REVERB's big knob, centred on it. Knob
     and stack are centred in the column as one group (Andrew, 10-17: layout B), so both sit RTYPE_SHIFT (-35.25 px)
     left of where they would alone. LOOP-toggle type; the active choice takes the accent while the panel is lit,
     a grey ring when it isn't */
  .rtype { position: absolute; left: 152.75px; top: 131px; width: 60px; display: flex; flex-direction: column;
           border: 1.2px solid var(--faint); border-radius: 9px; overflow: hidden; }
  .rtype button { height: 24px; margin: 0; padding: 0 0 0 0.12em; border: 0; background: transparent; cursor: pointer;
                  font: 700 11px var(--font); letter-spacing: 0.12em; color: var(--soft); }
  .rtype button + button { border-top: 1px solid var(--faint); }
  .rtype button:hover { color: var(--line); background: rgba(151,163,166,0.07); }
  .rtype button.on { color: var(--line); background: rgba(31,227,218,0.10); box-shadow: inset 0 0 0 1.4px var(--acc); cursor: default; }
  .rtype.unlit button.on { background: rgba(151,163,166,0.08); box-shadow: inset 0 0 0 1.2px var(--soft); }
  .rtype button:focus-visible { outline: 1px solid var(--teal); outline-offset: -3px; }
  #stage.bypass .rtype button.on { background: rgba(151,163,166,0.08); }
  /* off: the panel greys and dims, settings kept (knobs stay draggable) */
  .col .knob, .col .band, .col .secl, .col .bandv, .col .ter, .col .rtype, .col .namel .nm, .col .namel .val { transition: opacity .12s; }
  .col.off .knob, .col.off .band, .col.off .secl, .col.off .bandv, .col.off .ter, .col.off .rtype, .col.off .namel .nm, .col.off .namel .val { opacity: 0.32; }
  .col.off .knob, .col.off .band { pointer-events: auto; }

  /* ---------- master ---------- */
  .mst { top: 856px; height: 61px; display: flex; align-items: center; padding: 0 14px; gap: 12px; }
  .mst .lab { font-size: 12px; }
  #m-eq { left: 24px; width: 330px; }
  #m-eq .evcol { display: flex; flex-direction: column; gap: 4px; }
  #m-eq .ev { font-size: 11px; color: var(--soft); white-space: nowrap; letter-spacing: 0.04em; }
  #m-eq .ev b { color: var(--line); font-weight: 400; }
  #m-in { left: 366px; width: 150px; padding: 0 10px; gap: 10px; }
  #m-out { left: 528px; width: 150px; padding: 0 10px; gap: 10px; }
  .mst .knob { position: relative; }
  .mst .io { display: flex; flex-direction: column; gap: 3px; }
  .mst .io .val { font-size: 13px; white-space: nowrap; }
  #m-mix { left: 690px; width: 330px; }
  #mixtrack { position: relative; flex: 1; height: 30px; cursor: ew-resize; touch-action: none; }
  #mixtrack .rail { position: absolute; left: 6px; right: 6px; top: 14px; height: 1.6px; background: rgba(151,163,166,0.55); }
  #mixtrack .fill { position: absolute; left: 6px; top: 13.5px; height: 2.4px; background: rgba(31,227,218,0.9); }
  #mixtrack .hdl { position: absolute; top: 4px; width: 8px; height: 22px; margin-left: -4px; background: var(--line);
                   border: 1px solid rgba(151,163,166,0.85); border-radius: 2px; }
  #m-preset { left: 1032px; width: 300px; justify-content: space-between; }
  #m-preset .ibtn { width: 38px; height: 38px; }
  #pname { flex: 1; text-align: center; font: 700 16px var(--font); letter-spacing: 0.06em; cursor: pointer; color: var(--soft); }
  #pname.set { color: var(--teal); }
  .pill { top: 856px; height: 61px; border-radius: 31px; background: transparent; border: 1.3px solid var(--faint);
          cursor: pointer; font: 700 13px var(--font); letter-spacing: 0.12em; color: rgba(238,243,245,0.85); }
  .pill:hover { border-color: var(--soft); color: var(--line); }
  .pill { display: flex; align-items: center; justify-content: center; gap: 9px; }
  .pill svg { width: 20px; height: 20px; flex: none; }
  .pill.on { border: 2.4px solid var(--teal); color: var(--teal); }
  #m-byp { left: 1344px; width: 146px; }
  #m-gm { left: 1502px; width: 146px; }

  /* ---------- popup ---------- */
  #pop { position: absolute; z-index: 20; display: none; background: #0a0f10; border: 1.3px solid var(--soft); border-radius: 10px;
         padding: 8px; box-shadow: 0 14px 40px rgba(0,0,0,0.7); }
  #pop.open { display: block; }
  #pop input { width: 100%; height: 34px; background: var(--deep); border: 1.3px solid var(--faint); border-radius: 7px;
               color: var(--line); font: 400 13px var(--font); padding: 0 10px; outline: none; letter-spacing: 0.04em; }
  #pop input:focus { border-color: var(--teal); }
  #pop ul { list-style: none; margin: 6px 0 0; padding: 0; max-height: 260px; overflow: auto; }
  #pop li { padding: 8px 10px; border-radius: 6px; font-size: 13px; letter-spacing: 0.06em; cursor: pointer; display: flex; justify-content: space-between; color: var(--line); }
  #pop li .n { color: var(--soft); font-size: 11px; }
  #pop li.cur { color: var(--teal); }
  #pop li:hover, #pop li.hl { background: rgba(31,227,218,0.18); }
  #pop li.new { color: var(--soft); border-top: 1px solid var(--faint); border-radius: 0 0 6px 6px; margin-top: 4px; }
  #pop li.new:hover, #pop li.new.hl { color: var(--teal); text-shadow: 0 0 8px rgba(31,227,218,0.55); }
  #pop .none { padding: 8px 10px; font-size: 12px; color: var(--soft); }
  #pop li.info { color: var(--soft); font-size: 11px; cursor: default; }
  #pop li.info:hover { background: none; }
  #pop li.head { color: var(--soft); font-size: 11px; font-weight: 700; letter-spacing: 0.16em; cursor: default; padding: 6px 10px 4px; }
  #pop li.head:hover { background: none; }
  #pop li.sep { border-top: 1px solid var(--faint); border-radius: 0 0 6px 6px; margin-top: 4px; }
  #pop li .p { color: var(--soft); font-size: 10px; letter-spacing: 0.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
               max-width: 170px; margin-left: 10px; }
  /* the window's corner grip: drag to resize (ln_resize). Hosts with a resizable frame work too. */
  #grip { left: 1640px; top: 921px; width: 30px; height: 18px; cursor: nwse-resize; touch-action: none; opacity: 0.55; }
  #grip:hover, #grip.on { opacity: 1; }
  #grip svg { display: block; width: 30px; height: 18px; }
  #bank .name.missing { color: var(--soft); }
</style>
</head>
<body>
<div id="stage">
  <div id="frame" class="abs"></div>

  <!-- ================= header ================= -->
  <div id="logo" class="abs">
    <svg width="48" height="43" viewBox="-29 -26 58 52" aria-hidden="true">
      <polygon id="hx1" fill="none" stroke="#eef3f5" stroke-width="2.4" stroke-linejoin="miter"/>
      <polygon id="hx2" fill="none" stroke="#97a3a6" stroke-width="1.5" stroke-linejoin="miter"/>
      <polygon id="hx3" fill="rgba(31,227,218,0.2)" stroke="#1fe3da" stroke-width="1.9" stroke-linejoin="miter"/>
    </svg>
    <span id="wordmark">LOOPNEST</span>
  </div>

  <div id="tabs" class="abs" role="tablist">
    <button class="tab on" data-mode="audition" role="tab" aria-label="AUDITION"><svg class="ico" viewBox="0 0 30 26" aria-hidden="true"><path d="M6 17 V13 A9 9 0 0 1 24 13 V17" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><rect x="3.8" y="14.6" width="5" height="8.2" rx="1.8" fill="none" stroke="currentColor" stroke-width="1.6"/><rect x="21.2" y="14.6" width="5" height="8.2" rx="1.8" fill="none" stroke="currentColor" stroke-width="1.6"/></svg><span class="t">AUDITION</span></button>
    <button class="tab" data-mode="fx" role="tab" aria-label="LIVE"><svg class="ico" viewBox="0 0 30 26" aria-hidden="true"><g transform="rotate(-35 15 13)" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M0.8 13 H5" stroke-width="1.6"/><rect x="5" y="9" width="9" height="8" rx="1.6" stroke-width="1.6"/><path d="M7.6 11.2 V14.8 M10.2 11.2 V14.8" stroke-width="1.1"/><rect x="14" y="10.4" width="2.4" height="5.2" rx="0.6" stroke-width="1.4"/><rect x="16.4" y="11.6" width="7.6" height="2.8" stroke-width="1.4"/><path d="M24.9 11.6 H26.4 Q29.2 13 26.4 14.4 H24.9 Z" stroke-width="1.4"/></g></svg><span class="t">LIVE</span></button>
  </div>

  <!-- ================= hero ================= -->
  <div id="nest" class="abs group">
    <button id="bank" class="strip dimmable" aria-haspopup="listbox" aria-label="Bank"><span class="name" id="bank-name"></span><span class="chev"><svg class="caret" viewBox="0 0 10 6" aria-hidden="true"><path d="M1 1 L5 5 L9 1" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span></button>
    <label id="n-search" class="strip dimmable"><svg viewBox="0 0 14 14" aria-hidden="true"><circle cx="5.8" cy="5.8" r="4.4" fill="none" stroke="#97a3a6" stroke-width="1.4"/><path d="M9.2 9.2 L12.8 12.8" stroke="#97a3a6" stroke-width="1.5" stroke-linecap="round"/></svg><input id="n-q" type="text" placeholder="SEARCH" spellcheck="false" autocomplete="off" aria-label="Search the nest"><span id="n-count"></span><button id="n-x" aria-label="Clear search" tabindex="-1">×</button></label>
    <div id="n-step" class="strip dimmable"><button class="ibtn" id="n-up" aria-label="Previous tape" tabindex="-1">◀</button><div id="n-pos" title="Type a loop number"></div><button class="ibtn" id="n-dn" aria-label="Next tape" tabindex="-1">▶</button></div>
    <div id="n-rack" class="dimmable" role="listbox" aria-label="Nest"></div>
    <div id="n-rail" class="dimmable"><div id="n-thumb"></div></div>
    <div id="n-drop" aria-hidden="true"></div>
    <canvas id="cas"></canvas>
    <svg id="n-wire" viewBox="0 0 640 444" aria-hidden="true">
      <path id="wire-p" fill="none" stroke="#1fe3da" stroke-width="1.6" stroke-linejoin="round" pathLength="1"/>
      <circle id="wire-a" r="2.6" fill="#1fe3da"/><circle id="wire-b" r="2.6" fill="#1fe3da"/>
    </svg>
    <button id="spin" class="key" aria-label="Spin: load a random tape from the rack"><canvas id="dial"></canvas><span class="lbl">SPIN</span></button>
    <button id="h-back" class="hist" aria-label="Back to the loop before" disabled>◀</button>
    <button id="h-fwd" class="hist" aria-label="Forward to the loop after" disabled>▶</button>
  </div>
  <canvas id="scope" class="abs"></canvas>
  <div id="ctx-a" class="abs" style="width:1px;height:1px;pointer-events:none"></div>

  <button id="pl-play" class="abs key layer audonly"><svg id="play-ico" viewBox="0 0 20 20" aria-hidden="true"></svg>PLAY</button>
  <button id="loop-t" class="abs layer audonly" aria-pressed="false" aria-label="Loop"><svg viewBox="0 0 20 20" aria-hidden="true">
    <path d="M13.6 3.8 A7 7 0 1 0 16.8 8.2" fill="none" stroke-width="2.2" stroke-linecap="round"/>
    <path class="hd" d="M16.9 3.2 L17.3 8.6 L12.4 7.6 Z"/></svg>LOOP<span class="led" aria-hidden="true"></span></button>
  <button id="snap-t" class="abs layer audonly" aria-pressed="true" aria-label="Snap the trim handles to the drum hits"></button>
  <button id="bpm-t" class="abs layer audonly" aria-haspopup="listbox" aria-label="Loop tempo" style="display:none"></button>
  <input id="bpm-in" class="abs layer audonly" type="text" inputmode="decimal" spellcheck="false" autocomplete="off" aria-label="The file's tempo, BPM">
  <div id="tempo" class="abs strip layer audonly">
    <div class="tcol">
      <div class="row"><span class="lab">Tempo</span><button id="sync">SYNC</button></div>
      <div class="val" id="tempo-line" title="Drag up or down to set a tempo. SYNC snaps back to the host."></div>
    </div>
    <span class="div" aria-hidden="true"></span>
    <div class="pcol" id="pitch"><span id="pitch-knob"></span><span class="io"><span class="lab">Pitch</span><span class="val sl" style="--n:6" id="pitch-v">+0 st</span></span></div>
  </div>
  <canvas id="meters" class="abs layer fxonly"></canvas>

  <button id="fx" class="abs layer audonly" role="switch" aria-checked="false" aria-label="Print with FX"><svg class="fxi" viewBox="0 0 20 20" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-linejoin="round"><path d="M8.5 3.5 Q9.4 9.6 15 11 Q9.4 12.4 8.5 18.5 Q7.6 12.4 2 11 Q7.6 9.6 8.5 3.5 Z" stroke-width="1.5"/><path d="M15.5 1.6 Q15.9 3.7 17.8 4.2 Q15.9 4.7 15.5 6.8 Q15.1 4.7 13.2 4.2 Q15.1 3.7 15.5 1.6 Z" stroke-width="1.2"/></g></svg><span class="fxl">FX</span><span class="led" aria-hidden="true"></span></button>
  <button id="bin" class="abs key layer audonly" aria-haspopup="listbox" aria-label="Print bin">
    <span class="row"><span class="lab">Bin</span><span class="chev"><svg class="caret" viewBox="0 0 10 6" aria-hidden="true"><path d="M1 1 L5 5 L9 1" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span></span>
    <span class="path" id="bin-path"></span>
  </button>
  <button id="hatch" class="abs key layer audonly" tabindex="-1">
    <span class="rest">HATCH</span>
    <canvas id="hatch-cv"></canvas>
    <span class="grip" aria-hidden="true"></span>
    <span class="file" id="hatch-file"></span>
    <span class="restale"><svg viewBox="0 0 44 44" aria-hidden="true"><path d="M34.5 15 A14 14 0 1 0 36 26" fill="none" stroke="#eef3f5" stroke-width="3.2" stroke-linecap="round"/><path d="M38 6 L36.4 17.6 L25.6 13.8 Z" fill="#eef3f5"/></svg>RE-HATCH</span>
  </button>
  <span id="odd-note" class="abs layer audonly" hidden>odd length, turn Warp off in Live</span>


  <!-- ================= rack ================= -->
  <div id="rack" class="abs group" aria-label="Character"></div>

  <!-- ================= master ================= -->
  <div id="m-eq" class="abs strip mst"><span class="lab">EQ</span><div class="evcol"><span class="ev" id="eq-v">LOW CUT <b class="sl l" style="--n:8" id="eq-lo"></b>&nbsp;·&nbsp; HIGH CUT <b class="sl l" style="--n:8" id="eq-hi"></b></span><span id="eq-band-host" style="position:relative;width:262px;height:26px;display:block"></span></div></div>
  <div id="m-in" class="abs strip mst"><span id="in-k"></span><span class="io"><span class="lab">Input</span><span class="val sl" style="--n:8" id="in-v"></span></span></div>
  <div id="m-out" class="abs strip mst"><span id="out-k"></span><span class="io"><span class="lab">Output</span><span class="val sl" style="--n:8" id="out-v"></span></span></div>

let rwOn = false, rwT0 = 0, rwFrom = 0;
let aL = 0, aR = 0, jit = 0, tapeL = 0;

const GRAIN = [];

const TP = new Float32Array(2 * 200);
let tpN = 0, tpBotA = 0, tpBotB = 0;
const segNx = new Float32Array(6), segNy = new Float32Array(6);

function buildTape(bowW, tremF) {
  NODES[0].r = rL; NODES[5].r = rR;
  const N = NODES.length;
  for (let i = 0; i < N - 1; i++) {
    const a = NODES[i], b = NODES[i + 1];

    const base = Math.atan2(dy, dx);
    const off = Math.acos(Math.max(-1, Math.min(1, (a.r - b.r) / D)));
    const mx = (a.x + b.x) / 2 - GX, my = (a.y + b.y) / 2 - GY;
    const n1x = Math.cos(base + off), n1y = Math.sin(base + off);
    const n2x = Math.cos(base - off), n2y = Math.sin(base - off);
    const first = (mx * n1x + my * n1y) >= (mx * n2x + my * n2y);
    segNx[i] = first ? n1x : n2x; segNy[i] = first ? n1y : n2y;

  const push = (x, y) => { TP[tpN * 2] = x; TP[tpN * 2 + 1] = y; tpN++; };
  const STEPS = 20;
  for (let i = 0; i < N - 1; i++) {
    const a = NODES[i], b = NODES[i + 1], nx = segNx[i], ny = segNy[i];
    const px = a.x + a.r * nx, py = a.y + a.r * ny;
    const qx = b.x + b.r * nx, qy = b.y + b.r * ny;
    const len = Math.hypot(qx - px, qy - py);
    const bowAmp = bowW * (i === 2 ? 8 : 4);
    const bow = bowAmp * (0.75 * Math.sin(wowPh + i * 0.8) + 0.25 * Math.sin(wowPh2 + i * 1.9));

    if (i === 2) tpBotA = tpN;

      const u = s / STEPS, envU = Math.sin(Math.PI * u);

      push(px + (qx - px) * u + nx * disp, py + (qy - py) * u + ny * disp);

    if (!propsOk[id] || p.start !== a || p.end !== b || Math.abs((p.interval || 0) - iv) > 1e-6) rangeBad.push(`${id}: ${p.start}..${p.end} /${p.interval} skew ${p.skew}`);
    if (Math.abs(v - PARAM_DEFAULTS[id]) > 1e-4) defaultBad.push(`${id}=${v} (default ${PARAM_DEFAULTS[id]})`);
    const x = a + (b - a) * 0.37, back = fromNorm(id, toNorm(id, x));     // natural -> normalised -> natural
    if (Math.abs(back - x) > 1e-6 * Math.max(1, Math.abs(b - a))) mathBad.push(`${id}: ${x} -> ${back}`);
  }
  for (const id of TOGGLE_IDS) { relays[id] = tget(id); if (tget(id) !== TOGGLE_DEFAULTS[id]) defaultBad.push(`${id}=${tget(id)} (default ${TOGGLE_DEFAULTS[id]})`); }
  relays.reverbType = rtSeen ? rtypeGet() : null;            // null: no value from the relay yet
  if (!propsOk.reverbType || (rtRelay.properties.choices || []).join() !== 'Plate,Hall,Spring') rangeBad.push(`reverbType: ${(rtRelay.properties.choices || []).join('/')}`);
  if (!rtSeen) defaultBad.push('reverbType: no value received from the relay');
  else if (rtypeGet() !== REVERB_TYPE_DEFAULT) defaultBad.push(`reverbType=${rtypeGet()} (default ${REVERB_TYPE_DEFAULT})`);
  const litIdx = spines.findIndex(b => b.classList.contains('sel'));
  let nz = 0, pmax = 0; for (const v of wavePeaks) { if (v > 0.01) nz++; pmax = Math.max(pmax, v); }
  const ex = { x: +(HATCH_REF.x * fit).toFixed(2), y: +(HATCH_REF.y * fit).toFixed(2), w: +(HATCH_REF.w * fit).toFixed(2), h: +(HATCH_REF.h * fit).toFixed(2) };
  const hr = rect(hatchBtn);
  return {
    errors: (window.__lnErr || []).slice(), warnings: (window.__lnWarn || []).slice(),
    fonts: [...document.fonts].map(f => `${f.family} ${f.weight} ${f.status}`), fontsStatus: document.fonts.status,
    fit, inner: [innerWidth, innerHeight], dpr: window.devicePixelRatio, fps,
    state: lastState ? { sample: lastState.sample, folder: lastState.folder, count: lastState.count, index: lastState.index,
      live: lastState.live, playing: lastState.playing, hatch: lastState.hatch, printName: lastState.printName, sync: lastState.sync,
      hostBpm: lastState.hostBpm, nativeBpm: lastState.nativeBpm, bpmSource: lastState.bpmSource, tagBpm: lastState.tagBpm, freeBpm: lastState.freeBpm, barOrigin: lastState.barOrigin, bin: lastState.bin, binMissing: lastState.binMissing } : null,
    rack: { rows: spines.length, filesNames: files.names.length, countText: $('n-count').textContent, pos: $('n-pos').textContent,
      litRow: litIdx, litName: litIdx >= 0 ? spines[litIdx].title : null, matchesState: !!lastState && litIdx === lastState.index },
    bank: $('bank-name').textContent, label: { name: PICK.src, fitted: PICK.name, bpm: PICK.bpm, shown: labelState().text },
    peaks: { n: PEAKS.n, seconds: PEAKS.seconds, name: PEAKS.name, hits: PEAKS.hits.length, columnsAbove1pct: nz, max: +pmax.toFixed(3), scopeHasWave: scopeSig.includes(PEAKS.path) && PEAKS.n > 0 },
    relays, reverbTypeReceived: rtSeen, rangeBad, defaultBad, mathRoundTripBad: mathBad,
    hatch: { rect: hr, expected: ex, match: ['x', 'y', 'w', 'h'].every(k => Math.abs(hr[k] - ex[k]) < 0.51), cls: hatchBtn.className, file: $('hatch-file').textContent },
    footer: footText, snap: $('snap-t').textContent,
    mode: stage.classList.contains('fx') ? 'LIVE' : 'AUDITION', tempo: $('tempo-line').textContent, preset: $('pname').textContent,
    hist: { back: !$('h-back').disabled, fwd: !$('h-fwd').disabled, backRect: rect($('h-back')), fwdRect: rect($('h-fwd')), spinRect: rect($('spin')),
            matchesState: !!lastState && !$('h-back').disabled === !!lastState.histBack && !$('h-fwd').disabled === !!lastState.histFwd },
  };
}
// A native round trip for every float parameter: set a test value through the page's setter (a
// gesture, as a knob drag does), then ask the relay for the processor's value again and compare.
// Restores each parameter to what it was. Writes parameters: tests only.
let rt = null;
function roundTrip() {
  const before = {}, want = {};
  rt = { running: true };
  for (const id of SLIDER_IDS) {
    before[id] = pget(id);
    const [a, b, iv] = RANGES[id]; let x = id === 'warp' ? 25 : a + (b - a) * (id === 'end' ? 0.75 : 0.25);
    if (iv > 0) x = a + iv * Math.round((x - a) / iv);
    want[id] = x; pbegin(id); pset(id, x); pend(id);
  }
  setTimeout(() => {
    for (const id of SLIDER_IDS) { sl[id].scaledValue = NaN; be.emitEvent('__juce__slider' + id, { eventType: 'requestInitialUpdate' }); }
    setTimeout(() => {
      const bad = [], got = {};
      for (const id of SLIDER_IDS) { got[id] = pget(id); if (!(Math.abs(got[id] - want[id]) < 1e-3 * Math.max(1, RANGES[id][1] - RANGES[id][0]))) bad.push(`${id}: set ${want[id]} got ${got[id]}`); }
      for (const id of SLIDER_IDS) { pbegin(id); pset(id, before[id]); pend(id); }
      rt = { running: false, checked: SLIDER_IDS.length, bad, warp: { set: want.warp, got: got.warp } };
    }, 400);
  }, 400);
  return 'started';
}
window.__ln = Object.freeze({
  state: () => lastState,
  files: () => files,
  check,
  roundTrip, roundTripResult: () => rt,
  setParam: (id, v) => { pbegin(id); pset(id, v); pend(id); return pget(id); },   // the knob path (tests)
  view: () => ({ ...VIEW }), setView: (a, b) => { setView(a, b); return { ...VIEW }; },
  getParam: id => pget(id),
  reverbType: () => rtypeGet(), setReverbType: i => { rtypeSet(i); return rtypeGet(); },   // the selector's path (tests); -1 = no value yet
  snap: () => SNAP.on, setSnap: on => { SNAP.on = !!on; syncSnap(); return SNAP.on; },
  snapN, bars: barsOf, hits: () => Array.from(PEAKS.hits),
});

// No WebKit menu (Reload, Back, Inspect) anywhere but a text field's own; the scope opens its
// own (U-L5). No file lands on the page itself either: only the native view over the rack takes
// drops, and WebKit would open a file dropped elsewhere in its media player (B6). dropEffect
// 'none' refuses it, so a HATCH drag let go over the plugin ends as cancelled (U-M5).
document.addEventListener('contextmenu', e => { if (!(e.target instanceof HTMLInputElement)) e.preventDefault(); });
document.addEventListener('dragover', e => { e.preventDefault(); if (e.dataTransfer) e.dataTransfer.dropEffect = 'none'; });
document.addEventListener('drop', e => e.preventDefault());

// ================================================================ init
resize();
syncPlay(); syncLoop(); syncTempo(); syncFx(); syncBin(); syncPreset(); syncBank(); syncNestText(); syncSnap();
setHatch('idle');
setModeClass(false);
for (const e of [wireP, wireA, wireB]) e.style.opacity = 0;   // no loaded row until ln_state says so
renderAll();
addEventListener('resize', () => { resize(); syncMix(); scopeSig = ''; });
// Moving the window to a display with another pixel density fires no resize: re-size the canvases.
(function watchDpr() {
  const mq = matchMedia(`(resolution: ${window.devicePixelRatio || 1}dppx)`);
  mq.addEventListener('change', () => { resize(); scopeSig = ''; watchDpr(); }, { once: true });
})();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { PICK.name = labelName(PICK.src); buildShell(); buildScopeF(); checkScope(true); dialDirty = true; redrawHatch(); });
requestAnimationFrame(frame);
nf.ready();                                  // native answers with ln_files, ln_peaks, ln_state
</script>
